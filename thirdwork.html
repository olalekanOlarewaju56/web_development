<!DOCTYPE html>
<html lang="en">
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f8fb;
            text-align: center;
        }
        header {
            background-image: url('https://i.imgur.com/RurqKDM.jpg');
            color: #f4f8fb;
            padding: 50px 20px;
            background-size: cover;
            background-position: center;
        }
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }
        header p {
            font-size: 1.2rem;
            margin-bottom: 30px;
        }
        .action-button{
            padding: 10px 20px;
            background-color: #007bff;
            color: blue;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .action-button :hover {
            background-color: #0056b3;
        }
    .feature {
        margin: 10px;
        padding: 20px;
        background-color: white;
        border-radius: 5px;
        box-shadow: 0 2px 6px rgba(red, green, blue, alpha);
        transition: transform 0.3s ease;
        box-shadow: 0 4px 8px rgba(red, green, blue, alpha);

        }
        .feature :hover {
            transform: scale(1.05);
            box-shadow: 04px 8px rgba(red, green, blue, alpha);
        }
        footer{
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
        }

    </style>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>Welcome to Our Service</h1>
        <p>Discover the future of online experince.</p>
        <button class="Action button">Learn More</button>
    </header>
    <section class="features">
        <div class="feature">
            <h2>Feature one</h2>
            <p>Discription of Feature One</p>
        </div>
        <div class="feature">
            <h2>Feature two</h2>
            <p>Discription of Feature Two</p>
        </div>
        <!--More feature-->   
    </section>
    <footer>
        <p>2025 Dynamic Landing Page. All right reserved.</p>
    </footer>
    
</body>
</html>
