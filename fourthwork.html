<!DOCTYPE html>
<html lang="en">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f8fb;
        }
        header {
            background-color: #333;
            color: white;
            padding: 15px 0;
            display: flex;
            justify-content: space-between;
            text-align: center;
        }
        .header-content {
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .header-content h1 {
            margin: 0;
            flex-grow: 1;
        }
        nav ul {
            list-style: none;
            display: flex;
            margin: 0;
            padding: 0;

        }
        nav ul li {
            margin: 0 15px;
        }
        nav ul li a {
            color: white;
            text-decoration: none;
            padding: 5px 10px;
            transition: color 0.3s ease;
        }
        nav ul li a:hover {
            color: #a8dadc;

        }
        .cart-icon img {
            width: 30px;
            height: auto;
        }
        .product-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
        }
        .product {
            background-color: white;
            margin: 10px;
            padding: 20px;
            width: calc((100% / 3)-40px);
            box-shadow: 0 2px 6px rgba(red, green, blue, alpha);
            text-align: center;
            transition: transform 0,3s ease, box-shadow 0,3s ease;
        }
        .product :hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 8px rgba(red, green, blue, alpha);
        }
        .product img {
            max-width: 100%;
            height: auto;
            margin-bottom: 15px;
        }
        .product h2 {
            color: #333;
            margin-bottom: 10px;   
            
        }
        .price {
            color: #007bff;
            font-size: 1.2rem;
            margin-bottom: 15px;
        }
        .add-to-cart {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;

        }
        .add-to-cart :hover{
            background-color: #218838;

        }
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px 0;
        }
        @media screen and (max-width: 768px) {.product 
            { width: calc;

            }
        }
    </style>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body> 
    <header>
        <div class="header-content">
            <h1> Our Online Store</h1>
            <nav>
                <ul>
                    <li><a href="#home">Home</a></li>
                    <li><a href="#new-arrival">New Arrivals</a></li>
                    <li><a href="#best-seller">Best Sellers</a></li>
                    <li><a href="#sale">Sale</a></li>
                </ul>
                <div class="cart-icons">
                </div>
            </nav>
        </div>
    </header>
    <main class="product-container">
        <!--products-->
        <section class="prduct" id="product1">
            <img src="hppts://i.imgur.com/LXwNDDd.jpg" width="100%" alt="product 1">
             <h2>Product 1</h2>
             <p class="price">$19.99</p>
             <button class="add-to-cart">add to cart</button>

        </section>
        <section class="product" id="product1">
             <img src="hppts://i.imgur.com/LXwNDDd.jpg" width="100%" alt="product 1">
             <h2>product 2</h2>
             <p class="price">$21.99</p>
             <button add-to-cart>add to cart</button>

        </section>
        <section class="product" id="product1">
             <img src="hppts://i.imgur.com/LXwNDDd.jpg" width="100%" alt="product 1">
             <h2>product 3</h2>
             <p class="price">$24.99</p>
             <button add-to-cart>add to cart</button>

        </section>
        <section class="product" id="product1">
             <img src="hppts://i.imgur.com/LXwNDDd.jpg" width="100%" alt="product 1">
             <h2>product 4</h2>
             <p class="price">$9.99</p>
             <button add-to-cart>add to cart</button>

        </section>

    </main>
    <footer>
        <p>@2025 Our Online Store. All rights reserved</p>
    </footer>
    
</body>
</html>
